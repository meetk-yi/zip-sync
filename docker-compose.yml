version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
      - projects:/app/projects
      - builds:/app/builds
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - app-network

  # Isolated container for running user projects
  project-runner:
    image: node:18-alpine
    volumes:
      - projects:/projects:ro
    networks:
      - isolated-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    user: "1001:1001"
    restart: "no"
    profiles:
      - project-isolation

volumes:
  uploads:
  projects:
  builds:

networks:
  app-network:
    driver: bridge
  isolated-network:
    driver: bridge
    internal: true
